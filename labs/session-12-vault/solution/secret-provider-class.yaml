# Meme objet qu'en session 5, autre provider : "vault" au lieu de "gcp".
# Le pod ne sait pas d'ou viennent ses fichiers. C'est tout l'interet.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-vault
  namespace: exercices
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    # Le role Kubernetes auth cree a l'etape 4.
    roleName: "api"
    # Le token du pod est demande pour cette audience, et le role la verifie.
    audience: "vault"
    objects: |
      - objectName: "api-key"
        secretPath: "kv/data/exercices/api"
        secretKey: "API_KEY"
      - objectName: "db-username"
        secretPath: "database/static-creds/api"
        secretKey: "username"
      - objectName: "db-password"
        secretPath: "database/static-creds/api"
        secretKey: "password"
