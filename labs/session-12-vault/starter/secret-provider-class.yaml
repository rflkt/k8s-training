# Meme objet qu'en session 5, autre provider : "vault" au lieu de "gcp".
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-vault
  namespace: exercices
spec:
  # TODO 1 : le provider
  provider: ""
  parameters:
    vaultAddress: "http://vault.vault.svc:8200"
    # TODO 2 : le nom du role Kubernetes auth cree a l'etape 4
    roleName: ""
    audience: "vault"
    # TODO 3 : trois fichiers
    #   api-key      <- cle API_KEY du secret KV kv/exercices/api
    #   db-username  <- cle "username" de database/static-creds/api
    #   db-password  <- cle "password" de database/static-creds/api
    # Rappel : en KV v2, secretPath contient "data/".
    objects: |
      - objectName: "api-key"
        secretPath: ""
        secretKey: ""
