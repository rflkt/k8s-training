# Le ServiceAccount EST l'identite de l'app aupres de Vault.
# Un ServiceAccount par app : jamais "default", jamais partage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: exercices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: exercices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        # Changer cette valeur fait rouler les pods. Le CSI driver ne remonte
        # pas un pod existant quand la SecretProviderClass change : c'est ce
        # qui force un remontage propre (voir "Pieges", 7.2).
        secrets.training/backend: "vault"
    spec:
      # TODO 1 : faire tourner le pod sous le ServiceAccount "api"
      containers:
        - name: api
          image: api:vault
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Pas d'identifiants dans l'URL : l'API les lit dans les fichiers
            # a chaque nouvelle connexion, et suit donc les rotations.
            - name: DATABASE_URL
              value: "postgres://postgres.exercices.svc.cluster.local:5432/app?sslmode=disable"
            # TODO 2 : DB_USER_FILE et DB_PASSWORD_FILE, les chemins des
            # deux fichiers montes par le CSI driver
            - name: API_KEY_PATH
              value: /mnt/secrets-store/api-key
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        # TODO 3 : un volume CSI (driver secrets-store.csi.k8s.io, readOnly)
        # qui pointe sur la SecretProviderClass api-vault
        - name: secrets
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: exercices
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
